# fleet-installations.conf — registry of the fleet installations this head can see.
#
# Consumed by setup/scripts/fleet-drift.sh (the probe), surfaced by
# global/hooks/checks/22-fleet-drift.sh as the FLEET_DRIFT signal at session start.
#
# One row per repo whose content lineage descends from this installation and whose
# divergence you choose to tolerate or correct. The thresholds ARE the machine-readable
# form of that choice — raising one grants a sub-fleet more freedom, lowering it asks to
# hear sooner. Deleting a row does not delete the installation; it deletes your sight of it.
#
# The probe REPORTS and never reconciles. It will not fetch-merge, push, re-graft or
# otherwise touch a sub-fleet: deciding what to force and what to tolerate is yours.
#
# Format (pipe-separated, no spaces around pipes):
#   id|class|remote-url|branch|vantage(local-repo:remote-name)|warn-behind|severe-behind
#
# class:   mirror     — a copy expected to track this head closely; drift here is lag.
#          deployment — a downstream fleet with its own commits; drift is expected.
# vantage: a local repo that already carries that remote, used to count commits.
#          Use "-" to degrade to an ls-remote tip check, which reports
#          "counts unavailable on this machine" rather than a fabricated 0/0.
#
# THIS FILE SHIPS EMPTY BY DESIGN. Uncomment and edit the examples below, or leave it
# as-is: with no rows registered the check reports "no sub-fleets registered" and costs
# nothing. It is not an error to have none.
#
# Examples:
#   team-mirror|mirror|git@github.com:your-org/agent-fleet.git|main|~/agent-fleet:mirror|20|100
#   team-deploy|deployment|git@github.com:your-org/team-agent-fleet.git|main|~/agent-fleet:deploy|50|200
