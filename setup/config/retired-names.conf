# retired-names.conf — fleet names that were retired, and what replaces them (CFG-1094).
#
# Read by setup/scripts/project-conformance-lib.sh, which rewrites a project manifest's
# pointer to a retired name into the replacement (the only CLAUDE.md text the conformance
# check may rewrite — Q-1094-INBOX, owner decision of 2026-11-25). Shared with the consumer
# scan planned as CFG-1092: a name added here extends both checks without a code change.
#
# One block per retired name:
#   [<retired text>]          the literal that is retired, matched as a fixed substring
#   replacement = <text>      what replaces the literal
#   suffix = <text>           appended once per line, right after the replaced literal (after its
#                             closing backtick when the literal sits in backticks); {prefix} is the
#                             path prefix that stood before the literal (`~/cfg-agent-fleet/`, or
#                             nothing for a repo-relative mention). No bare `|`: most pointers sit
#                             in table rows and a pipe would split the cell (use `<t>`, not `<a|b>`)
#   keep-when = <words>       a line carrying any of these words (case-insensitive) is a deliberate
#                             mention of the retired name — it describes the old thing — and stays
#   approver = <who>          who retired the name — the Rule-removed trailer's approver token; a
#                             role word (owner) keeps this file generic across fleet installations
#   since = YYYY-MM-DD        when (the trailer's date; never in the future)
#   ref = <free text>         where the decision is recorded
# Blank lines and # comments are ignored. A block without replacement is scan-only (CFG-1092).

[cross-project/inbox.md]
replacement = cross-project/inbox/<project>.md
suffix = , filed with `bash {prefix}setup/scripts/inbox-file.sh --project <p> --type <t> --body "…"`
keep-when = legacy spillover
approver = owner
since = 2026-11-25
ref = CFG-542 (one inbox file per project), CFG-1091 (global docs rewritten, commit b62154e5), Q-1094-INBOX (owner decision, 2026-11-25)
