# Project kind → tools worth having (CFG-829). Read by setup/scripts/kind-tools-check.sh,
# which onboarding (foundation/first-run-refinement.md) runs to SUGGEST installs — it never
# installs. Kinds match setup/config/project-type-knowledge.conf where they overlap; `all`
# rows are checked for every user. Package column "-" = not packaged there, see the tool's site.
# A check must not contain "|" (the column separator) — use $(...) tests instead of pipes or ||.
# kind     | tool       | check                                        | apt                    | dnf                | pacman              | brew                  | why
