all        | git        | command -v git                               | git                    | git                | git                 | git                   | every project is a git repo
all        | tmux       | command -v tmux                              | tmux                   | tmux               | tmux                | tmux                  | background jobs (tmux-launch.sh)
all        | jq         | command -v jq                                | jq                     | jq                 | jq                  | jq                    | hooks and scripts parse JSON with it
