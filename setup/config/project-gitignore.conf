# project-gitignore.conf — the .gitignore lines every fleet project carries (CFG-817, CFG-941, CFG-1094).
# One pattern per line, written exactly as it goes into .gitignore. Read by
# setup/scripts/new-project.sh (a new project gets them all) and by
# setup/scripts/project-conformance-lib.sh (an existing project is topped up with the missing
# ones). A line added here reaches every registered project through the conformance check.
tmp/
.claude/.session-lock
.claude/.session-role.*
docs/terminal-logs/
