# network-signals.conf — corp/dev network detection signals for iv-agent-fleet.
#
# POPULATED BY GLOBAL IT. Until filled in, detection returns "unknown", which the agent
# treats as "corp" (the stricter ruleset) — fail-safe by design. Never set a "dev" fallback.
#
# This is a shell-sourced file: KEY="value" (quote values). Comma-separate multiple values.
# See global/knowledge/agentic-coding-guideline.md (§2) for how these are used.

# --- DNS-based detection (substring match against the machine's DNS search/domain) ---
# Corp network DNS suffix(es), e.g. "example.com,example.net"
CORP_DNS_SUFFIX=""
# Dev network DNS suffix(es), e.g. "dev.example.com,devnet.local"
DEV_DNS_SUFFIX=""

# --- Reachability-based detection (TCP connect; only tried if DNS is inconclusive) ---
# A host that resolves/answers ONLY on the corp network.
CORP_PROBE_HOST=""
CORP_PROBE_PORT="443"
# A host that resolves/answers ONLY on the dev network.
DEV_PROBE_HOST=""
DEV_PROBE_PORT="443"

# --- Fail-safe fallback when nothing matches. MUST be "corp" or "unknown" (never "dev"). ---
NETWORK_FALLBACK="unknown"
