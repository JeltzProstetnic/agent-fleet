# Project type → MCP servers ENABLED at creation (CFG-789). Read by setup/scripts/new-project.sh.
# Every other server in ~/.mcp.json is written to disabledMcpjsonServers, so a new project never
# opens Claude Code's approval dialog with all servers pre-checked.
# Compound types ("business + writing") get the union of their parts. Unknown types use `default`.
# Servers missing from a user's ~/.mcp.json are simply skipped.
