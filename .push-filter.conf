# Push filter configuration for filtered-push.sh
# Defines what to exclude when pushing to a public/template repo
#
# Format:
#   private_remote=<name>    — the private remote (typically 'origin')
#   public_remote=<name>     — the public/template remote
#   branch=<branch>          — branch to push
#   exclude=<path>           — exclude a specific file path
#   exclude_glob=<pattern>   — exclude files matching a glob pattern

private_remote=origin
public_remote=template
branch=main

# Session state files (contain personal task context)
exclude=session-context.md
exclude=session-history.md
exclude=next-session-task.md

# Cross-project files (contain personal project names and tasks)
exclude=cross-project/inbox.md
exclude=cross-project/dashboard-cache.md

# Session archive (full personal session history)
exclude=docs/session-log.md

# Pending files (personal session handoffs)
exclude_glob=docs/pending-*.md

# Machine files (contain SSH keys, auth state, hostnames)
exclude_glob=global/machines/*.md

# Registry (contains personal project paths)
exclude=registry.md

# Add your own exclusions below:
# exclude=secrets/vault.json.enc
# exclude_glob=setup/projects/*/
